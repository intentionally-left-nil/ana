[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2021"
rust-version = "1.82"

# Pinned as git dependencies at a fixed tag, not crates.io: these are uv's
# internal `0.0.x`-versioned component crates with no semver guarantee, same
# policy pixi uses for the same crates. The three below are path-interdependent
# within one uv commit -- bump them together, deliberately, with a changelog
# read, not on autopilot. See investigations/pep508_to_matchspec_api.md, whose
# "Bump history" subsection records what was checked (and what changed) for
# each tag bump, most recently `0.9.7` -> `0.12.6`.
[workspace.dependencies]
uv-normalize = { git = "https://github.com/astral-sh/uv", tag = "0.12.6" }
uv-pep440 = { git = "https://github.com/astral-sh/uv", tag = "0.12.6" }
uv-pep508 = { git = "https://github.com/astral-sh/uv", tag = "0.12.6" }

# `ana-pep508-to-matchspec`'s `MatchSpec`/`VersionSpec`/`PackageName` target
# type (see investigations/pep508_to_matchspec_api.md), and (as of the
# `ana-solver` crate) the actual conda solve itself. Pinned as git
# dependencies at a fixed commit against `intentionally-left-nil/rattler`
# (a fork of `conda/rattler`) rather than crates.io, per that fork's own
# request -- all four crates below come from the *same* commit of the
# *same* repo so Cargo resolves them as one checkout with mutually
# consistent versions (the fork's own `rattler_conda_types` 0.52.1 matches
# the version this workspace was already pinned to on crates.io, so this
# swap is not expected to change `ana-pep508-to-matchspec`/
# `ana-marker-matchspec`'s behavior). Bump all four together, at the same
# `rev`, the same way the uv trio above is bumped together.
rattler_conda_types = { git = "https://github.com/intentionally-left-nil/rattler", rev = "66ffb3a7e4083629a7df8e6e41d6d54da037b742" }

# `ana-solver`'s actual conda dependency solve (the `resolvo` backend --
# `libsolv_c` is not enabled, since it needs a vendored C build and
# `resolvo` is already the crate's own default).
rattler_solve = { git = "https://github.com/intentionally-left-nil/rattler", rev = "66ffb3a7e4083629a7df8e6e41d6d54da037b742", default-features = false, features = [
  "resolvo",
] }

# `ana-solver`'s channel/subdir repodata fetching (with on-disk caching) --
# the `gateway` feature is additive, off by default upstream; TLS support
# (`rustls`) is *not* disabled here (unlike `rattler_solve` below) because
# it's part of this crate's own `default` feature set, needed for any
# `https://` channel URL to work at all -- confirmed the hard way: an
# earlier `default-features = false` here built a TLS-less `reqwest`
# client that rejected every `https://` request with a confusing
# "scheme is not http" error.
rattler_repodata_gateway = { git = "https://github.com/intentionally-left-nil/rattler", rev = "66ffb3a7e4083629a7df8e6e41d6d54da037b742", features = [
  "gateway",
] }

# `ana-solver`'s virtual-package detection for the platform being solved
# for -- `VirtualPackages::detect_for_platform` already knows how to
# report sane baseline values when that platform isn't the host machine's
# own (`investigations/lock_generation_algorithm.md`'s cross-platform
# mode), so `ana-solver` calls it uniformly for every platform rather than
# special-casing "am I solving for the platform I'm running on".
rattler_virtual_packages = { git = "https://github.com/intentionally-left-nil/rattler", rev = "66ffb3a7e4083629a7df8e6e41d6d54da037b742" }

# `ana-solver`'s async runtime: `rattler_repodata_gateway::Gateway` is an
# async API (network I/O), but `ana-lockfile::Solver::solve` is a plain
# sync trait method -- see that trait's own docs on why the seam is sync.
# `ana-solver` bridges the two with one `tokio::runtime::Runtime` per
# solver instance and `Runtime::block_on`, rather than infecting the whole
# workspace's otherwise-synchronous convention
# (`investigations/pep508_to_matchspec_api.md`'s "Threading" section) with
# `async fn`.
tokio = { version = "1", features = ["rt-multi-thread"] }

# `ana-solver`'s own hardcoded `"defaults"` -> `repo.anaconda.com/pkgs/*`
# channel expansion (see `crates/ana-solver/src/channels.rs`) builds those
# URLs directly rather than through `rattler_conda_types::Channel::from_str`'s
# generic alias resolution, so it needs `url::Url` itself, not just the
# `Url`-typed fields already reachable through `rattler_conda_types`.
# Version matches the fork's own workspace pin (`url = "2"`).
url = "2"

indexmap = "2.5"
thiserror = "2.0"

# Command-line parsing for the `ana` binary (derive API). The grammar
# started small enough to hand-roll; subcommand help and value validation
# made clap the cheaper option.
clap = { version = "4", features = ["derive"] }

# ana-pypi-conda-map's on-disk cache envelope (see
# investigations/pypi_conda_map.md): `serde`+`serde_json` to parse the
# upstream API response, `rmp-serde` to encode the envelope as MessagePack.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"

# Durable atomic file replacement (tempfile-in-same-dir + rename), living
# in ana-fs-util and shared by ana-lockfile and ana-pypi-conda-map;
# `directories` is ana-pypi-conda-map's OS-appropriate cache directory
# resolution.
tempfile = "3.27"
directories = "6.0"

# Cross-process mutual exclusion for the state files ana crates write
# (ana.lock, ana-pypi-conda-map's cache): advisory flock on Unix,
# LockFileEx on Windows, via a small dedicated lock file -- never the data
# file itself, since that's replaced by rename on every write and a lock
# on its old inode wouldn't block a renamer. Lives in ana-fs-util's
# `AdvisoryLock`; ana-lockfile also depends on it directly for the guard
# type in its poll-with-notices acquisition loop.
fd-lock = "4.0"

# HTTP client for ana-pypi-conda-map. Deliberately `ureq`, not `reqwest`:
# `reqwest`'s blocking mode still runs a private tokio runtime underneath
# and pulls in a full tokio/hyper/quinn stack (~100 transitive crates) for
# what is here just one GET and one HEAD request with conditional headers.
# `ureq` is genuinely blocking (no async runtime hidden inside it) and pulls
# in ~30 -- it matches this workspace's existing fully-synchronous
# convention (see investigations/pep508_to_matchspec_api.md's "Threading"
# section) rather than working against it.
ureq = "3.2"

# TOML front end (see investigations/pep508_to_matchspec_api.md's
# "ana-pyproject" section: `toml_edit`, matching pixi's own choice for this
# job, not the `toml` crate or the `pyproject-toml` crate). `display` is on
# for `ana-lockfile`'s sake: writing `ana.lock` splices one platform section
# into the existing document while leaving every other key untouched (see
# investigations/lock_generation_algorithm.md's "Read-modify-write"), which
# requires formatting a document back out, not just reading one.
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }

# SHA-256 for `ana-lockfile`'s staleness bookkeeping (pyproject.toml content
# hash + per-platform lock-section hash -- see
# investigations/lock_generation_algorithm.md's "Stage 1 / Stage 2").
# Already in the dependency graph transitively via `rattler_digest`; declared
# here because `ana-lockfile` hashes directly.
sha2 = "0.11"

# Parallel requirement-string parsing (see the same investigation's
# "Threading" section). We call into the process-global pool via
# `par_iter`/`into_par_iter` and never construct our own `ThreadPoolBuilder`
# -- a second pool in the same process would compete with the first for
# cores instead of sharing them.
rayon = "1.10"
