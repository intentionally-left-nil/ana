[package]
name = "ana-environment"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
description = "Resolves an ana invocation (project directory, or CLI-declared requirements) to an Environment: a declaration, its group selection, and its filesystem paths"

[dependencies]
ana-dependency = { path = "../ana-dependency" }
ana-environment-yml = { path = "../ana-environment-yml" }
ana-matchspec-convert = { path = "../ana-matchspec-convert" }
ana-paths = { path = "../ana-paths" }
ana-pypi-conda-map = { path = "../ana-pypi-conda-map" }
ana-pyproject = { path = "../ana-pyproject" }
ana-requirements = { path = "../ana-requirements" }
ana-requirements-txt = { path = "../ana-requirements-txt" }
indexmap = { workspace = true }
rattler_conda_types = { workspace = true }
thiserror = { workspace = true }
uv-normalize = { workspace = true }
uv-pep440 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
uv-pep508 = { workspace = true }
